<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Little Voices</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #app {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    #picture {
        width: min(86vw, 86vh);
        height: min(86vw, 86vh);

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #f4f4f4;

        font-size: min(38vw, 38vh);

        user-select: none;
        -webkit-user-select: none;

        cursor: pointer;

        box-shadow:
            0 8px 30px rgba(0, 0, 0, 0.12);

        transition:
            transform 0.12s ease,
            box-shadow 0.12s ease;
    }

    #picture:active {
        transform: scale(0.94);
        box-shadow:
            0 4px 15px rgba(0, 0, 0, 0.10);
    }

    #picture.listened {
        animation: gentlePulse 0.35s ease;
    }

    @keyframes gentlePulse {
        0% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.04);
        }

        100% {
            transform: scale(1);
        }
    }
</style>
</head>

<body>

<div id="app">
    <div id="picture" role="button" aria-label="Tap"></div>
</div>

            zu: "induku ye-hockey"
        }

];

const languages = ["en", "zu"];

let objectIndex = 0;
let languageIndex = 0;
let voices = [];

function updateVoices() {
    if ("speechSynthesis" in window) {
        voices = window.speechSynthesis.getVoices();
    }
}

if ("speechSynthesis" in window) {
    updateVoices();
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = updateVoices;
    }
}

function getBestVoice(lang) {
    if (!voices || voices.length === 0) {
        updateVoices();
    }
    // 1. Exact match (e.g. en-ZA, zu-ZA)
    let voice = voices.find(v => v.lang && v.lang.toLowerCase() === lang.toLowerCase());
    if (voice) return voice;

    // 2. Prefix match (e.g. en for en-ZA, zu for zu-ZA)
    const primary = lang.split('-')[0].toLowerCase();
    voice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(primary));
    if (voice) return voice;

    return null;
}

const picture = document.getElementById("picture");

function showObject() {
    picture.textContent = objects[objectIndex].picture;
}

function speakWord() {
    const object = objects[objectIndex];
    const language = languages[languageIndex];
    const word = object.words[language];

    if (!("speechSynthesis" in window)) {
        return;
    }

    window.speechSynthesis.cancel();
    if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
    }

    const utterance = new SpeechSynthesisUtterance(word);

    if (language === "en") {
        utterance.lang = "en-ZA";
        const voice = getBestVoice("en-ZA");
        if (voice) utterance.voice = voice;
    } else if (language === "zu") {
        utterance.lang = "zu-ZA";
        const voice = getBestVoice("zu-ZA");
        if (voice) utterance.voice = voice;
    }

    // Slow rate for child understanding
    utterance.rate = 0.65;
    utterance.pitch = 1.05;
    utterance.volume = 1.0;

    window.speechSynthesis.speak(utterance);

    picture.classList.remove("listened");
    void picture.offsetWidth;
    picture.classList.add("listened");

    advance();
}

function advance() {
    languageIndex++;

    if (languageIndex >= languages.length) {
        languageIndex = 0;
        objectIndex++;

        if (objectIndex >= objects.length) {
            objectIndex = 0;
        }
    }

    showObject();
}

let lastInteractionTime = 0;

function handleInteraction(event) {
    const now = Date.now();
    if (now - lastInteractionTime < 400) {
        return;
    }
    lastInteractionTime = now;
    event.preventDefault();
    speakWord();
}

picture.addEventListener("click", handleInteraction);
picture.addEventListener("touchend", handleInteraction);

showObject();

</script>
